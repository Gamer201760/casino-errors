# Сид
seed: 1

# Игроки

# Кол-во рандомных игроков (max 30)
generate_player_count: 30

# Потолок для генерации базового баланса игрока
generate_player_max_bal: 100 

# Потолок для генерации удачи игрока
generate_player_lucky_bal: 40 

# Гуси

# Кол-во рандомных гусей (max 30)
generate_goose_count: 30

# Вероятность генерации атакующего гуся
generate_war_goose_p: 0.5

# Потолок для генерации удачи гуся
generate_goose_lucky_bal: 20 

# Потолок для генерации базового баланса гуся
generate_goose_max_bal: 100

# Потолок для генерации базовой силы гуся
generate_goose_max_strenght: 30 

# Потолок для генерации базовой громкости гуся
generate_goose_max_honk_volume: 30 

# Симуляция

# Минимальная ставка 
bet_min: 1

# Максимальная ставка как доля от текущего баланса (0.0..1.0)
bet_max_fraction: 0.30

# Максимальный множитель выигрыша
bet_win_multiplier_max: 4

# Базовая вероятность выигрыша
bet_win_base: 0.50

# Насколько удача масштабирует шанс выигрыша
bet_win_lucky_scale: 0.01

# Базовая вероятность потери денег при паники
panic_base: 0.50

# Масштабирование паники от удачи
panic_lucky_scale: 0.005

# Базовая вероятность гуся атаковать самого себя
self_attack_base: 0.15

# Масштабирование self-attack от удачи
self_attack_lucky_scale: 0.01

# Минимальный размер стаи
flock_min_size: 2

# Максимальный размер стаи
flock_max_size: 4

# Веса событий (чем больше вес, тем чаще событие выбирается)
event_weights:
  bet: 60           # Ставка
  goose_attack: 40  # Атака гуся
  flock_create: 10  # Создание стаи
  flock_disband: 5  # Распад стаи
  panic: 5          # Паника
